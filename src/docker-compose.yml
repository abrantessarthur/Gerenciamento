services:
  db:
    image: mysql:8.4
    container_name: gerenciamento-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gerenciamentoCampo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: arthur
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: main/java
    container_name: gerenciamento-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gerenciamentoCampo
      SPRING_DATASOURCE_USERNAME: arthur
      SPRING_DATASOURCE_PASSWORD: 1234
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRATION: 900000

volumes:
  db_data: